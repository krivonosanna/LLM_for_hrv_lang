# .github/workflows/ci.yml
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc  # DVC required to pull data

      - name: Configure DVC remote (DAGsHub)
        run: |
          dvc remote add origin https://dagshub.com/krivonosanna/LLM_for_hrv_lang.dvc
          dvc remote modify origin auth basic
          dvc remote modify origin user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify origin password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull DVC-tracked data and model
        run: dvc pull

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
